# ─────────────────────────────────────────────
# 아침 공고 브리핑 설정
# ─────────────────────────────────────────────

# 기관당 최대 선별 건수
max_per_agency: 3

# 최근 N일 이내 등록 공고만 대상 (API 계층에 적용)
recent_days: 7

# ─── 키워드 (그룹명: [동의어/변형 표기]) ───
# 공고명·요약에 아래 단어 중 하나라도 포함되면 매칭.
# ※ '안전', '인증', '보증' 등 짧은 단어는 오탐(false positive)이 늘어날 수 있음.
#   운영하면서 너무 많이 잡히면 단어를 더 구체적으로 수정할 것.
keywords:
  시니어돌봄: [시니어, 돌봄, 노인돌봄, 케어]
  고령친화사업: [고령친화, 고령자, 초고령]
  디지털전환: [디지털 전환, 디지털전환, DX, 디지털혁신]
  재난안전: [재난, 안전산업, 안전관리]
  클라우드: [클라우드, SaaS]
  마케팅: [마케팅, 판로]
  홍보지원: [홍보]
  수상: [표창, 유공, 포상, 시상, 공적]
  인증: [인증]
  특례보증: [특례보증, 보증지원]
  에이지테크: [에이지테크, 에이지 테크, AgeTech, 고령친화기술]

# ─── 제외 키워드 ───
# 공고명·요약에 아래 단어가 하나라도 포함되면 매칭 키워드가 있어도 제외.
# 운영하며 불필요한 공고 유형이 보이면 여기에 단어를 추가할 것.
exclude_keywords:
  - 채용
  - 인사
  - 입찰
  - 용역
  - 평가위원
  - 심사위원
  - 자문위원
  - 강사 모집
  - 교육생
  - 수강생
  - 입주기업 모집
  - 임대
  - 임차
  - 설명회
  - 결과 공고
  - 선정 결과
  - 유찰
  - 재공고 취소

# ─── 대상 기관 (34곳, 업로드 리스트 기준) ───
# source 우선순위:
#   1) bizinfo  : 기업마당 API 결과에서 소관/수행기관명 매칭 (기본값)
#   2) kstartup : K-Startup 전용 API
#   3) board    : 개별 게시판 스크래핑 (url + selector 채워야 동작)
# match: 기업마당 기관명 필드와 부분일치시킬 문자열 목록
agencies:
  # ── board url이 채워진 기관 = 게시판 직접 수집 (검증 완료) ──
  # ── board url이 빈 기관 = 기업마당 API로 커버 (match 이름으로 분류) ──
  # 게시판을 추가하려면: 해당 기관 공고 목록 페이지 주소를 url에 붙여넣기만 하면 됨
  #   board: {url: "공고목록주소"}

  - name: 부산정보산업진흥원
    match: [부산정보산업진흥원]
    board: {url: "https://bipa.kr/board/business/list", link_contains: "/board/business/view"}
  - name: 정보통신산업진흥원(NIPA)
    match: [정보통신산업진흥원]
    board: {url: "https://www.nipa.kr/home/2-2", link_contains: "/home/2-2/"}
  - name: 부산테크노파크
    match: [부산테크노파크]
    board: {url: "https://www.btp.or.kr/kor/CMS/Board/Board.do?mCode=MN013"}
  - name: 한국보건산업진흥원
    match: [한국보건산업진흥원, 보건산업진흥원]
    board: {url: "https://www.khidi.or.kr/board?menuId=MENU01108", link_contains: "/board/view"}
  - name: 고령친화산업지원센터
    match: [고령친화산업지원센터]
    board: {url: "https://www.khidi.or.kr/board?menuId=MENU00325&siteId=SITE00003", link_contains: "/board/view"}

  # ── 이하 기업마당 커버 (게시판 URL 확인되면 board 줄 추가) ──
  - name: 연구개발특구진흥재단
    match: [연구개발특구진흥재단, 특구재단]
  - name: 산업통상자원부
    match: [산업통상자원부]
  - name: 전북테크노파크
    match: [전북테크노파크]
  - name: 경남테크노파크
    match: [경남테크노파크]
  - name: 한국사회보장정보원
    match: [한국사회보장정보원, 사회보장정보원]
  - name: 광주테크노파크
    match: [광주테크노파크]
  - name: 한국디지털헬스케어진흥재단
    match: [디지털헬스케어진흥재단]
  - name: 중소벤처기업부
    match: [중소벤처기업부]
  - name: 범부처통합연구지원시스템(IRIS)
    match: [범부처, IRIS]
  - name: 보건복지부
    match: [보건복지부]
  - name: 농림축산식품부
    match: [농림축산식품부]
  - name: 중앙사회서비스원
    match: [중앙사회서비스원]
  - name: 광주경제진흥상생일자리재단
    match: [광주경제진흥상생일자리재단]
  - name: 한국농어촌공사
    match: [한국농어촌공사]
  - name: 전남정보문화산업진흥원
    match: [전남정보문화산업진흥원]
  - name: 한국바이오특화센터협의회
    match: [바이오특화센터]
  - name: 한국지능정보사회진흥원(NIA)
    match: [지능정보사회진흥원]
  - name: 저출산고령사회위원회
    match: [저출산고령사회위원회]
  - name: 광주정보문화산업진흥원
    match: [광주정보문화산업진흥원]
  - name: 한국디지털헬스산업협회
    match: [디지털헬스산업협회]
  - name: 부산시민운동지원센터
    match: [부산시민운동지원센터]
  - name: 부산사회서비스원
    match: [부산사회서비스원]
  - name: K-Startup
    source: kstartup
  - name: 부산경제진흥원
    match: [부산경제진흥원]
  - name: 한국사회기술원
    match: [한국사회기술원]
  - name: KITA(한국무역협회)
    match: [한국무역협회, KITA]
  - name: KOTRA
    match: [KOTRA, 대한무역투자진흥공사]
  - name: 전남바이오진흥원
    match: [전남바이오진흥원]
  - name: 한국산업기술원
    match: [한국산업기술원]
